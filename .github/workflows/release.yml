name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build DMG
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build app
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: scripts/build-app.sh

      - name: Create DMG
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${APP_VERSION#v}"
          STAGING="dist/dmg"
          DMG="dist/Teams-Meeting-Status-${VERSION}.dmg"
          rm -rf "$STAGING" "$DMG"
          mkdir -p "$STAGING"
          ditto "dist/Teams Meeting Status for Home Assistant.app" "$STAGING/Teams Meeting Status for Home Assistant.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Teams Meeting Status ${VERSION}" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          codesign --verify --deep --strict --verbose=2 "dist/Teams Meeting Status for Home Assistant.app"
          hdiutil verify "$DMG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${APP_VERSION#v}"
          gh release create "$APP_VERSION" "dist/Teams-Meeting-Status-${VERSION}.dmg" --verify-tag --generate-notes --title "Teams Meeting Status ${VERSION}"
